[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "check-proxy-tax"
version = "0.1.0"
description = "CLI tool to audit real proxy costs, 403 blowout multipliers, and effective price per 1,000 usable requests."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Kais / 600me" }]
keywords = [
    "proxy",
    "scraping",
    "benchmark",
    "http",
    "cost",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.scripts]
check-proxy-tax = "check_proxy_tax.cli:main"

[project.urls]
Homepage = "https://github.com/600me/check-proxy-tax"
Repository = "https://github.com/600me/check-proxy-tax"
Issues = "https://github.com/600me/check-proxy-tax/issues"
Benchmark = "https://scrape.mybskm.top/?utm_source=cli&utm_content=check-proxy-tax"

[tool.setuptools]
packages = ["check_proxy_tax"]
